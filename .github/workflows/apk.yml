name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore and google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f app/google-services.json ]; then
            if [ -f google-services.json ]; then
              cp google-services.json app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "ERROR: app/google-services.json is missing. Add GOOGLE_SERVICES_JSON to GitHub Repository Secrets or upload app/google-services.json."
              exit 1
            fi
          fi
          ACTUAL_SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -oE 'SHA1: [A-F0-9:]+' | cut -d' ' -f2 | tr -d ':' | tr 'A-F' 'a-f')
          echo "Using debug.keystore SHA1: $ACTUAL_SHA1"
          if [ -z "$ACTUAL_SHA1" ] || ! grep -qi "$ACTUAL_SHA1" app/google-services.json; then
            echo "ERROR: debug.keystore SHA1 ($ACTUAL_SHA1) does not match app/google-services.json! Add DEBUG_KEYSTORE_BASE64 secret from debug.keystore.base64."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: M-Notes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
