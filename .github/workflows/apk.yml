name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o M-Notes.zip -d _src
          if [ "$(ls -A _src | wc -l)" -eq 1 ] && [ -d "_src/$(ls -A _src)" ]; then
            src="_src/$(ls -A _src)"
          else
            src="_src"
          fi
          mkdir -p app_src
          cp -a "$src"/. app_src/
          ls -la app_src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app
        run: |
          mkdir build_app && cd build_app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/status-bar@7
          if [ -f ../google-services.json ]; then npm install @capacitor-firebase/authentication@7 --legacy-peer-deps; fi
          mkdir www
          cp ../app_src/index.html ../app_src/manifest.json ../app_src/sw.js ../app_src/backup-cloud.js www/
          npx cap init "M Notes" com.moamen.mnotes --web-dir www
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.android={adjustMarginsForEdgeToEdge:'force'};c.plugins={StatusBar:{style:'LIGHT'},FirebaseAuthentication:{skipNativeAuth:true,providers:['google.com']}};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          npx cap add android
          if [ -f ../google-services.json ]; then cp ../google-services.json android/app/google-services.json; fi
          npx cap sync android

      - name: Fix status bar
        run: |
          python3 - << 'PY'
          import re
          p='build_app/android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          add='\n        <item name="android:windowLightStatusBar">true</item>\n        <item name="android:windowBackground">#E2F6EF</item>'
          s=re.sub(r'<style name="AppTheme(\.NoActionBar)?" parent="[^"]*">',lambda m:m.group(0)+add,s)
          open(p,'w').write(s)
          print(s)
          PY

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          ls -la ~/.android

      - name: Build APK
        run: |
          cd build_app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: M Notes APK ${{ github.run_number }}
          files: build_app/android/app/build/outputs/apk/debug/app-debug.apk
